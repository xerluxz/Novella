<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Novella</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: a single-column study desk. Header with level counts, tab bar, then one working panel at a time. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#e4e9f1; --fg:#14213d; --muted:#5b6780; --line:#d3dae6;
  --accent:#1f4e9c; --accent-fg:#ffffff;
  --new:#b7791f; --new-bg:#fbefd5; --learn:#1a7f9c; --learn-bg:#d9f0f6; --known:#2a8a4a; --known-bg:#dcf2e3;
  --danger:#b3261e;
  --font-body:"Noto Sans Thai","Noto Sans KR",system-ui,sans-serif;
  --font-ko:"Noto Sans KR","Noto Sans Thai",sans-serif;
  --font-story:"Gowun Batang","Noto Sans KR",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1624; --surface:#18223a; --surface-2:#222f4d; --fg:#e8edf8; --muted:#97a3bf; --line:#2c3a5c;
  --accent:#7fa8f2; --accent-fg:#0f1624;
  --new:#f0be63; --new-bg:#3b2f14; --learn:#6cc6de; --learn-bg:#133541; --known:#74cf90; --known-bg:#173a25;
  --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1624; --surface:#18223a; --surface-2:#222f4d; --fg:#e8edf8; --muted:#97a3bf; --line:#2c3a5c;
  --accent:#7fa8f2; --accent-fg:#0f1624;
  --new:#f0be63; --new-bg:#3b2f14; --learn:#6cc6de; --learn-bg:#133541; --known:#74cf90; --known-bg:#173a25;
  --danger:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;margin:0;font-weight:600;text-wrap:balance}
h2{font-size:1.05rem;margin:0;font-weight:600}
.ko{font-family:var(--font-ko)}
header{display:flex;flex-direction:column;gap:12px}
.sub{color:var(--muted);font-size:.85rem;margin:0}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.count{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.count b{font-size:1.4rem;font-variant-numeric:tabular-nums;line-height:1.1}
.count span{font-size:.78rem;color:var(--muted)}
.count.new b{color:var(--new)}.count.learning b{color:var(--learn)}.count.known b{color:var(--known)}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
nav button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:9px 4px;border-radius:9px;cursor:pointer;min-width:0}
nav button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:14px}
.panel[hidden]{display:none}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input.ko-in{font-family:var(--font-ko);font-size:1.05rem}
textarea{resize:vertical;min-height:60px}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{padding:4px 9px;font-size:.8rem}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
@media (max-width:520px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:start;min-width:0}
.item .main{min-width:0}
.item .w{font-family:var(--font-ko);font-size:1.25rem;font-weight:500;overflow-wrap:anywhere}
.item .r{color:var(--muted);font-size:.85rem;margin-left:6px}
.item .m{overflow-wrap:anywhere}
.item .n{color:var(--muted);font-size:.82rem;margin-top:2px;overflow-wrap:anywhere}
.item .ex{font-family:var(--font-ko);font-size:.95rem;margin-top:4px;overflow-wrap:anywhere}
.item .side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.item .tools{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.chip{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);letter-spacing:.02em}
.lvl{font:inherit;font-size:.78rem;font-weight:500;border:0;border-radius:99px;padding:4px 11px;cursor:pointer}
.lvl.new{background:var(--new-bg);color:var(--new)}
.lvl.learning{background:var(--learn-bg);color:var(--learn)}
.lvl.known{background:var(--known-bg);color:var(--known)}
.sample{font-size:.7rem;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:0 6px;margin-left:6px}
.empty{color:var(--muted);text-align:center;padding:24px 12px;border:1px dashed var(--line);border-radius:12px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{flex-direction:row;align-items:center;gap:6px;color:var(--fg);font-size:.88rem}
.checks input{width:auto}
.gpick{display:flex;flex-direction:column;gap:4px;max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.gpick label{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:.88rem}
.gpick input{width:auto}
.story{font-family:var(--font-story);display:flex;flex-direction:column;gap:12px}
.story h3{margin:0;font-size:1.3rem;font-weight:700}
.story .tt{font-family:var(--font-body);color:var(--muted);font-size:.85rem;margin-top:-6px}
.sent{display:flex;flex-direction:column;gap:1px}
.sent .k{font-size:1.2rem;line-height:1.6}
.sent .rd,.sent .th{font-family:var(--font-body);font-size:.85rem;color:var(--muted)}
.hide-rd .rd{display:none}.hide-th .th{display:none}
.used{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--font-body)}
.flash{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.flash .big{font-family:var(--font-ko);font-size:2.4rem;font-weight:500;overflow-wrap:anywhere}
.flash .ans{display:flex;flex-direction:column;gap:2px;align-items:center}
.status{font-size:.78rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.88rem;max-width:calc(100% - 32px);z-index:5}
.err{color:var(--danger);font-size:.88rem}
.usage{grid-column:1/-1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.u-pat{font-size:.9rem;font-weight:500}
.u-ex{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:start;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.u-ex:last-of-type{border-bottom:0;padding-bottom:0}
.u-ex .ko{font-size:1.05rem;overflow-wrap:anywhere;grid-column:1}
.u-ex .n,.u-ex .m{grid-column:1;overflow-wrap:anywhere}
.u-ex button{grid-column:2;grid-row:1}
@media (prefers-reduced-motion:no-preference){.btn,.lvl,nav button{transition:background .15s}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Novella</h1>
      <p class="sub">เก็บคำศัพท์และไวยากรณ์ แล้วให้ Claude แต่งเรื่องสั้นจากสิ่งที่คุณรู้แล้ว</p>
    </div>
    <div class="counts" id="counts"></div>
  </header>

  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="vocab" aria-selected="true">คำศัพท์</button>
    <button role="tab" data-tab="grammar" aria-selected="false">ไวยากรณ์</button>
    <button role="tab" data-tab="story" aria-selected="false">เรื่องสั้น</button>
    <button role="tab" data-tab="review" aria-selected="false">ทบทวน</button>
  </nav>

  <!-- VOCAB -->
  <section class="panel" id="p-vocab">
    <form class="box" id="vForm" autocomplete="off">
      <h2 id="vFormTitle">เพิ่มคำศัพท์</h2>
      <div class="grid3">
        <label>คำเกาหลี<input id="vKo" class="ko-in" required placeholder="학교"></label>
        <label>คำอ่าน<input id="vRd" placeholder="ฮัก-เกียว"></label>
        <label>ความหมาย<input id="vMn" required placeholder="โรงเรียน"></label>
      </div>
      <div class="grid3">
        <label>ชนิดของคำ
          <select id="vPos"></select>
        </label>
        <label>ระดับความชำนาญ
          <select id="vLv"></select>
        </label>
        <label>โน้ต (ไม่บังคับ)<input id="vNote" placeholder="ใช้กับ 에 / 에서"></label>
      </div>
      <div class="grid2">
        <label>ประโยคตัวอย่าง (ไม่บังคับ)<input id="vEx" class="ko-in" placeholder="저는 학교에 가요."></label>
        <label>คำแปลประโยค<input id="vExTh" placeholder="ฉันไปโรงเรียน"></label>
      </div>
      <div class="row">
        <button class="btn primary" type="submit" id="vSubmit">บันทึกคำ</button>
        <button class="btn" type="button" id="vCancel" hidden>ยกเลิกการแก้ไข</button>
      </div>
    </form>
    <div class="filters">
      <input id="vSearch" type="search" placeholder="ค้นหาคำหรือความหมาย">
      <select id="vFLv"></select>
      <select id="vFPos"></select>
    </div>
    <div class="list" id="vList"></div>
  </section>

  <!-- GRAMMAR -->
  <section class="panel" id="p-grammar" hidden>
    <form class="box" id="gForm" autocomplete="off">
      <h2 id="gFormTitle">เพิ่มไวยากรณ์</h2>
      <div class="grid2">
        <label>รูปแบบประโยค<input id="gPat" class="ko-in" required placeholder="-(으)ㄹ 거예요"></label>
        <label>ความหมาย / วิธีใช้<input id="gMn" required placeholder="จะทำ... (อนาคต)"></label>
      </div>
      <div class="grid2">
        <label>ประโยคตัวอย่าง<input id="gEx" class="ko-in" placeholder="내일 학교에 갈 거예요."></label>
        <label>คำแปลตัวอย่าง<input id="gExTh" placeholder="พรุ่งนี้จะไปโรงเรียน"></label>
      </div>
      <div class="grid2">
        <label>ระดับความชำนาญ<select id="gLv"></select></label>
        <label>โน้ต (ไม่บังคับ)<input id="gNote" placeholder="ต่อท้ายกริยา"></label>
      </div>
      <div class="row">
        <button class="btn primary" type="submit" id="gSubmit">บันทึกไวยากรณ์</button>
        <button class="btn" type="button" id="gCancel" hidden>ยกเลิกการแก้ไข</button>
      </div>
    </form>
    <div class="list" id="gList"></div>
  </section>

  <!-- STORY -->
  <section class="panel" id="p-story" hidden>
    <div class="box">
      <h2>แต่งเรื่องสั้นจากคลังของคุณ</h2>
      <div>
        <div class="status" style="margin-bottom:6px">ใช้คำศัพท์ระดับ</div>
        <div class="checks" id="sLvls"></div>
      </div>
      <div>
        <div class="status" style="margin-bottom:6px">ไวยากรณ์ที่ให้ใช้ (ไม่เลือกเลย = ใช้ประโยคพื้นฐานมาก)</div>
        <div class="gpick" id="sGram"></div>
      </div>
      <div class="grid2">
        <label>ความยาว
          <select id="sLen">
            <option value="4-5">สั้น 4–5 ประโยค</option>
            <option value="6-8" selected>กลาง 6–8 ประโยค</option>
            <option value="10-12">ยาว 10–12 ประโยค</option>
          </select>
        </label>
        <label>ธีม (ไม่บังคับ)<input id="sTheme" placeholder="เช่น วันแรกที่มหาวิทยาลัย"></label>
      </div>
      <div class="row">
        <button class="btn primary" id="sGo" type="button">สร้างเรื่องสั้น</button>
        <span class="status" id="sInfo"></span>
      </div>
      <div class="err" id="sErr" hidden></div>
    </div>
    <div class="box" id="sOut" hidden></div>
    <h2>เรื่องที่บันทึกไว้</h2>
    <div class="list" id="sSaved"></div>
  </section>

  <!-- REVIEW -->
  <section class="panel" id="p-review" hidden>
    <div class="box">
      <div class="row between">
        <h2>ทบทวนคำศัพท์</h2>
        <div class="checks" id="rLvls"></div>
      </div>
      <div class="flash" id="flash"></div>
    </div>
  </section>

  <div class="status" id="where"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
var LV={new:'เพิ่งเริ่มจำ',learning:'กำลังจำ',known:'จำได้แล้ว'};
var LVORDER=['new','learning','known'];
var POS=['นาม','สรรพนาม','กริยา','คุณศัพท์','วิเศษณ์','ลักษณนาม/ตัวเลข','คำเชื่อม/คำช่วย','อื่นๆ'];
var S={vocab:[],grammar:[],stories:[]};
var col=null;            // db collection when signed in
var editing={vocab:null,grammar:null};
var armed=null;          // id awaiting delete confirmation
var curStory=null, queue=[], qi=0, revealed=false;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(t){var el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},2200)}

/* ---------- storage ---------- */
function lsGet(k){try{var v=localStorage.getItem('kr_'+k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem('kr_'+k,JSON.stringify(v))}catch(e){}}
function save(k){
  lsSet(k,S[k]);
  if(col){col.doc(k).set({items:S[k]}).catch(function(){toast('บันทึกไปยังบัญชีไม่สำเร็จ')})}
}
function sampleData(){
  var t=Date.now();
  S.vocab=[
    {id:uid(),ko:'학교',rd:'ฮัก-เกียว',mn:'โรงเรียน',pos:'นาม',lv:'known',note:'',sample:1,usage:'ตามด้วย 에 เมื่อบอกจุดหมาย และ 에서 เมื่อบอกสถานที่ทำกิจกรรม',exs:[{ko:'저는 학교에 가요.',rd:'โช-นึน ฮัก-เกียว-เอ คา-โย',th:'ฉันไปโรงเรียน'},{ko:'학교에서 친구를 만나요.',rd:'ฮัก-เกียว-เอ-ซอ ชิน-กู-รึล มัน-นา-โย',th:'พบเพื่อนที่โรงเรียน'}]},
    {id:uid(),ko:'친구',rd:'ชิน-กู',mn:'เพื่อน',pos:'นาม',lv:'known',note:'',sample:1},
    {id:uid(),ko:'가다',rd:'คา-ดา',mn:'ไป',pos:'กริยา',lv:'known',note:'',sample:1},
    {id:uid(),ko:'먹다',rd:'มอก-ตา',mn:'กิน',pos:'กริยา',lv:'learning',note:'',sample:1},
    {id:uid(),ko:'커피',rd:'คอ-พี',mn:'กาแฟ',pos:'นาม',lv:'learning',note:'',sample:1},
    {id:uid(),ko:'예쁘다',rd:'เย-ปือ-ดา',mn:'สวย น่ารัก',pos:'คุณศัพท์',lv:'new',note:'',sample:1},
    {id:uid(),ko:'오늘',rd:'โอ-นือล',mn:'วันนี้',pos:'วิเศษณ์',lv:'known',note:'',sample:1},
    {id:uid(),ko:'만나다',rd:'มัน-นา-ดา',mn:'พบ เจอ',pos:'กริยา',lv:'new',note:'ใช้กับ -을/를',sample:1}
  ];
  S.grammar=[
    {id:uid(),pat:'-아/어요',mn:'ท้ายประโยคสุภาพแบบไม่เป็นทางการ',ex:'저는 학교에 가요.',exTh:'ฉันไปโรงเรียน',lv:'known',note:'',sample:1},
    {id:uid(),pat:'-에 가다',mn:'ไปที่... (สถานที่)',ex:'친구가 학교에 가요.',exTh:'เพื่อนไปโรงเรียน',lv:'known',note:'',sample:1},
    {id:uid(),pat:'-(으)ㄹ 거예요',mn:'จะทำ... (อนาคต)',ex:'내일 친구를 만날 거예요.',exTh:'พรุ่งนี้จะพบเพื่อน',lv:'learning',note:'',sample:1}
  ];
  S.stories=[];
}
async function initStore(){
  var L={};['vocab','grammar','stories'].forEach(function(k){L[k]=lsGet(k)});
  var hasLocal=L.vocab||L.grammar||L.stories;
  if(hasLocal){['vocab','grammar','stories'].forEach(function(k){S[k]=L[k]||[]})}
  var db=null,uid_=null;
  try{
    if(window.claude&&window.claude.use){
      db=await window.claude.use('db');
      var user=await window.claude.use('user');
      uid_=user?await user.id():null;
    }
  }catch(e){db=null}
  var needSeed=!hasLocal;
  if(db&&uid_){
    try{
      col=db.collection('data/users/'+uid_);
      var found=false;
      for(var k of ['vocab','grammar','stories']){
        var snap=await col.doc(k).get();
        if(snap.exists){found=true;S[k]=(snap.data()||{}).items||[]}
      }
      if(found){needSeed=false}
      else if(hasLocal){['vocab','grammar','stories'].forEach(save);needSeed=false}
    }catch(e){col=null}
  }
  if(needSeed){sampleData();['vocab','grammar','stories'].forEach(save)}
  $('where').textContent=col?'บันทึกในบัญชีของคุณ ใช้ได้ทุกเครื่อง':'บันทึกในเบราว์เซอร์นี้เท่านั้น (ล้างข้อมูลเบราว์เซอร์แล้วจะหาย)';
  renderAll();
}

/* ---------- helpers ---------- */
function opts(sel,arr,withAll,allLabel){
  sel.innerHTML=(withAll?'<option value="">'+allLabel+'</option>':'')+arr.map(function(a){return '<option value="'+esc(a[0])+'">'+esc(a[1])+'</option>'}).join('');
}
function lvBtn(kind,it){return '<button class="lvl '+it.lv+'" data-act="cycle" data-kind="'+kind+'" data-id="'+it.id+'" title="แตะเพื่อเปลี่ยนระดับ">'+LV[it.lv]+'</button>'}
var openUse={},busyUse={};
function usageBlock(v){
  if(!openUse[v.id])return '';
  var exs=v.exs||[];
  var h='<div class="usage">';
  if(v.usage)h+='<div class="u-pat">'+esc(v.usage)+'</div>';
  if(exs.length){
    h+=exs.map(function(x,i){
      return '<div class="u-ex"><div class="ko">'+esc(x.ko)+'</div>'+(x.rd?'<div class="n">'+esc(x.rd)+'</div>':'')+(x.th?'<div class="m">'+esc(x.th)+'</div>':'')+
      '<button class="btn small danger" data-act="delex" data-id="'+v.id+'" data-i="'+i+'">ลบ</button></div>';
    }).join('');
  }else if(!v.usage){h+='<div class="status">ยังไม่มีประโยคตัวอย่าง เพิ่มเองในฟอร์มแก้ไข หรือให้ Claude สร้างให้</div>'}
  h+='<div class="row"><button class="btn small" data-act="genex" data-id="'+v.id+'"'+(busyUse[v.id]?' disabled':'')+'>'+(busyUse[v.id]?'กำลังสร้าง…':(exs.length||v.usage?'ขอตัวอย่างเพิ่มจาก Claude':'ให้ Claude สร้างตัวอย่าง'))+'</button></div></div>';
  return h;
}
async function genUsage(id){
  var v=S.vocab.find(function(x){return x.id===id});if(!v)return;
  var sample=null;
  try{sample=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){}
  if(!sample){toast('เปิดในแอป Claude เพื่อใช้ฟีเจอร์นี้');return}
  busyUse[id]=true;renderVocab();
  var known=S.vocab.filter(function(x){return x.lv!=='new'&&x.id!==id}).slice(0,40).map(function(x){return x.ko}).join(', ');
  var gram=S.grammar.filter(function(g){return g.lv!=='new'}).map(function(g){return g.pat}).join(', ');
  var prompt='Thai first-year learner of Korean. Word: '+v.ko+' ('+v.mn+', '+v.pos+').\n'+
  'Give how this word is used in sentences. Prefer simple sentences built from these words the learner knows: '+(known||'(none)')+'. Prefer these grammar patterns: '+(gram||'polite -아/어요')+'.\n'+
  'Return JSON only: {"usage":"1-2 short Thai sentences on the pattern, e.g. which particle or object marker goes with it and any common collocation","examples":[{"ko":"Korean sentence containing the word","rd":"Thai-script pronunciation","th":"Thai translation"}]} with exactly 3 examples, different patterns.'+
  (v.exs&&v.exs.length?' Do not repeat these: '+v.exs.map(function(x){return x.ko}).join(' | '):'');
  try{
    var r=await sample.json(prompt,{cache:false});
    if(!r||!r.examples||!r.examples.length)throw new Error('empty');
    v.usage=r.usage||v.usage||'';
    v.exs=(v.exs||[]).concat(r.examples.map(function(x){return{ko:x.ko||'',rd:x.rd||'',th:x.th||''}}));
    delete v.sample;save('vocab');
  }catch(e){toast(e&&e.code==='not_granted'?'ต้องอนุญาตให้ถาม Claude ก่อน':'สร้างตัวอย่างไม่สำเร็จ ลองอีกครั้ง')}
  finally{busyUse[id]=false;renderVocab()}
}
function tools(kind,it){
  return '<div class="tools">'+(kind==='vocab'?'<button class="btn small" data-act="usage" data-id="'+it.id+'" aria-expanded="'+(openUse[it.id]?'true':'false')+'">ตัวอย่างประโยค'+((it.exs&&it.exs.length)?' ('+it.exs.length+')':'')+'</button>':'')+'<button class="btn small" data-act="edit" data-kind="'+kind+'" data-id="'+it.id+'">แก้ไข</button>'+
  '<button class="btn small danger" data-act="del" data-kind="'+kind+'" data-id="'+it.id+'">'+(armed===kind+it.id?'ยืนยันลบ':'ลบ')+'</button></div>';
}
function lvChecks(el,def,name){
  el.innerHTML=LVORDER.map(function(l){return '<label><input type="checkbox" name="'+name+'" value="'+l+'"'+(def.indexOf(l)>-1?' checked':'')+'>'+LV[l]+'</label>'}).join('');
}
function checked(name){return Array.prototype.map.call(document.querySelectorAll('input[name="'+name+'"]:checked'),function(i){return i.value})}

/* ---------- render ---------- */
function renderCounts(){
  var c={new:0,learning:0,known:0};S.vocab.forEach(function(v){c[v.lv]++});
  $('counts').innerHTML=LVORDER.map(function(l){return '<div class="count '+l+'"><b>'+c[l]+'</b><span>'+LV[l]+'</span></div>'}).join('');
}
function renderVocab(){
  var q=$('vSearch').value.trim().toLowerCase(),fl=$('vFLv').value,fp=$('vFPos').value;
  var arr=S.vocab.filter(function(v){
    return (!fl||v.lv===fl)&&(!fp||v.pos===fp)&&(!q||(v.ko+' '+v.rd+' '+v.mn).toLowerCase().indexOf(q)>-1)
  });
  if(!arr.length){$('vList').innerHTML='<div class="empty">'+(S.vocab.length?'ไม่พบคำที่ตรงกับตัวกรอง':'ยังไม่มีคำศัพท์ เพิ่มคำแรกจากฟอร์มด้านบน')+'</div>';return}
  $('vList').innerHTML=arr.slice().reverse().map(function(v){
    return '<div class="item"><div class="main"><span class="w">'+esc(v.ko)+'</span><span class="r">'+esc(v.rd)+'</span>'+(v.sample?'<span class="sample">ตัวอย่าง</span>':'')+
    '<div class="m">'+esc(v.mn)+'</div>'+(v.note?'<div class="n">'+esc(v.note)+'</div>':'')+'</div>'+
    '<div class="side"><span class="chip">'+esc(v.pos)+'</span>'+lvBtn('vocab',v)+'</div>'+usageBlock(v)+tools('vocab',v)+'</div>';
  }).join('');
}
function renderGrammar(){
  if(!S.grammar.length){$('gList').innerHTML='<div class="empty">ยังไม่มีไวยากรณ์ เพิ่มรูปแบบแรกจากฟอร์มด้านบน</div>';return}
  $('gList').innerHTML=S.grammar.slice().reverse().map(function(g){
    return '<div class="item"><div class="main"><span class="w">'+esc(g.pat)+'</span>'+(g.sample?'<span class="sample">ตัวอย่าง</span>':'')+
    '<div class="m">'+esc(g.mn)+'</div>'+(g.ex?'<div class="ex">'+esc(g.ex)+'</div><div class="n">'+esc(g.exTh)+'</div>':'')+
    (g.note?'<div class="n">'+esc(g.note)+'</div>':'')+'</div><div class="side">'+lvBtn('grammar',g)+'</div>'+tools('grammar',g)+'</div>';
  }).join('');
}
function renderGramPick(){
  var prev=checked('sg');
  if(!S.grammar.length){$('sGram').innerHTML='<span class="status">ยังไม่มีไวยากรณ์ในคลัง</span>';return}
  $('sGram').innerHTML=S.grammar.map(function(g){
    var on=prev.length?prev.indexOf(g.id)>-1:g.lv!=='new';
    return '<label><input type="checkbox" name="sg" value="'+g.id+'"'+(on?' checked':'')+'><span><span class="ko">'+esc(g.pat)+'</span> <span class="status">'+esc(g.mn)+'</span></span></label>';
  }).join('');
}
function renderSaved(){
  if(!S.stories.length){$('sSaved').innerHTML='<div class="empty">เรื่องที่บันทึกไว้จะแสดงตรงนี้</div>';return}
  $('sSaved').innerHTML=S.stories.slice().reverse().map(function(s){
    return '<div class="item"><div class="main"><span class="w" style="font-family:var(--font-story)">'+esc(s.titleKo)+'</span><div class="n">'+esc(s.titleTh)+' · '+s.sentences.length+' ประโยค</div></div>'+
    '<div class="side"></div><div class="tools"><button class="btn small" data-act="open" data-id="'+s.id+'">เปิดอ่าน</button>'+
    '<button class="btn small danger" data-act="del" data-kind="stories" data-id="'+s.id+'">'+(armed==='stories'+s.id?'ยืนยันลบ':'ลบ')+'</button></div></div>';
  }).join('');
}
function renderStory(){
  var o=$('sOut');
  if(!curStory){o.hidden=true;return}
  var s=curStory,saved=S.stories.some(function(x){return x.id===s.id});
  o.hidden=false;
  o.innerHTML='<div class="row"><div class="checks"><label><input type="checkbox" id="tRd" checked>คำอ่าน</label><label><input type="checkbox" id="tTh" checked>คำแปล</label></div>'+
    '<button class="btn small" data-act="saveStory"'+(saved?' disabled':'')+' style="margin-left:auto">'+(saved?'บันทึกแล้ว':'บันทึกเรื่องนี้')+'</button></div>'+
    '<div class="story" id="storyBody"><h3>'+esc(s.titleKo)+'</h3><div class="tt">'+esc(s.titleTh)+'</div>'+
    s.sentences.map(function(x){return '<div class="sent"><div class="k">'+esc(x.ko)+'</div><div class="rd">'+esc(x.rd)+'</div><div class="th">'+esc(x.th)+'</div></div>'}).join('')+
    (s.used&&s.used.length?'<div class="used">'+s.used.map(function(w){return '<span class="chip ko">'+esc(w)+'</span>'}).join('')+'</div>':'')+'</div>';
  $('tRd').onchange=function(){$('storyBody').classList.toggle('hide-rd',!this.checked)};
  $('tTh').onchange=function(){$('storyBody').classList.toggle('hide-th',!this.checked)};
}
function startReview(){
  var lv=checked('rl');
  queue=S.vocab.filter(function(v){return lv.indexOf(v.lv)>-1});
  for(var i=queue.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=queue[i];queue[i]=queue[j];queue[j]=t}
  qi=0;revealed=false;renderFlash();
}
function renderFlash(){
  var f=$('flash');
  if(!queue.length){f.innerHTML='<div class="status">ไม่มีคำในระดับที่เลือก ลองติ๊กระดับอื่น หรือเพิ่มคำศัพท์</div>';return}
  if(qi>=queue.length){f.innerHTML='<div class="big" style="font-size:1.4rem;font-family:var(--font-body)">ครบ '+queue.length+' คำแล้ว</div><button class="btn primary" data-act="restart">เริ่มรอบใหม่</button>';return}
  var v=queue[qi];
  var h='<div class="status">'+(qi+1)+' / '+queue.length+'</div><div class="big">'+esc(v.ko)+'</div>';
  if(!revealed){h+='<button class="btn primary" data-act="reveal">ดูคำตอบ</button>'}
  else{
    h+='<div class="ans"><div>'+esc(v.rd)+'</div><div style="font-size:1.15rem;font-weight:500">'+esc(v.mn)+'</div><span class="chip">'+esc(v.pos)+'</span></div>'+
    (v.exs&&v.exs[0]?'<div class="ans" style="margin-top:4px"><div class="ko">'+esc(v.exs[0].ko)+'</div><div class="status">'+esc(v.exs[0].th)+'</div></div>':'')+
    '<div class="row" style="justify-content:center"><button class="lvl new" data-act="rate" data-lv="new">ยังไม่จำ</button><button class="lvl learning" data-act="rate" data-lv="learning">กำลังจำ</button><button class="lvl known" data-act="rate" data-lv="known">จำได้แล้ว</button></div>';
  }
  f.innerHTML=h;
}
function renderAll(){renderCounts();renderVocab();renderGrammar();renderGramPick();renderSaved();renderStory()}

/* ---------- forms ---------- */
$('vForm').addEventListener('submit',function(e){
  e.preventDefault();
  var d={ko:$('vKo').value.trim(),rd:$('vRd').value.trim(),mn:$('vMn').value.trim(),pos:$('vPos').value,lv:$('vLv').value,note:$('vNote').value.trim()};
  if(!d.ko||!d.mn)return;
  var exKo=$('vEx').value.trim(),exTh=$('vExTh').value.trim();
  if(editing.vocab){
    var it=S.vocab.find(function(x){return x.id===editing.vocab});Object.assign(it,d);delete it.sample;
    if(exKo){it.exs=(it.exs||[]).concat([{ko:exKo,rd:'',th:exTh}])}
    toast('แก้ไขแล้ว')}
  else{d.id=uid();d.exs=exKo?[{ko:exKo,rd:'',th:exTh}]:[];S.vocab.push(d);toast('เพิ่มคำแล้ว')}
  save('vocab');resetV();renderCounts();renderVocab();
});
function resetV(){editing.vocab=null;$('vForm').reset();$('vFormTitle').textContent='เพิ่มคำศัพท์';$('vEx').value='';$('vExTh').value='';$('vSubmit').textContent='บันทึกคำ';$('vCancel').hidden=true;$('vLv').value='new';$('vKo').focus()}
$('vCancel').onclick=resetV;
$('gForm').addEventListener('submit',function(e){
  e.preventDefault();
  var d={pat:$('gPat').value.trim(),mn:$('gMn').value.trim(),ex:$('gEx').value.trim(),exTh:$('gExTh').value.trim(),lv:$('gLv').value,note:$('gNote').value.trim()};
  if(!d.pat||!d.mn)return;
  if(editing.grammar){var it=S.grammar.find(function(x){return x.id===editing.grammar});Object.assign(it,d);delete it.sample;toast('แก้ไขแล้ว')}
  else{d.id=uid();S.grammar.push(d);toast('เพิ่มไวยากรณ์แล้ว')}
  save('grammar');resetG();renderGrammar();renderGramPick();
});
function resetG(){editing.grammar=null;$('gForm').reset();$('gFormTitle').textContent='เพิ่มไวยากรณ์';$('gSubmit').textContent='บันทึกไวยากรณ์';$('gCancel').hidden=true;$('gLv').value='new'}
$('gCancel').onclick=resetG;
['vSearch','vFLv','vFPos'].forEach(function(id){$(id).addEventListener('input',renderVocab)});

/* ---------- story generation ---------- */
$('sGo').onclick=async function(){
  var err=$('sErr');err.hidden=true;
  var lv=checked('sl');
  var pool=S.vocab.filter(function(v){return lv.indexOf(v.lv)>-1});
  if(pool.length<3){err.textContent='ต้องมีคำศัพท์ในระดับที่เลือกอย่างน้อย 3 คำ ลองติ๊กระดับเพิ่มหรือเพิ่มคำใหม่';err.hidden=false;return}
  var gids=checked('sg');
  var gram=S.grammar.filter(function(g){return gids.indexOf(g.id)>-1});
  if(pool.length>70){pool=pool.slice().sort(function(){return Math.random()-.5}).slice(0,70)}
  var sample=null;
  try{sample=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){}
  if(!sample){err.textContent='เปิดหน้านี้ในแอป Claude เพื่อใช้ฟีเจอร์แต่งเรื่อง';err.hidden=false;return}
  var btn=$('sGo');btn.disabled=true;$('sInfo').textContent='กำลังแต่งเรื่อง…';
  var prompt='You write very short Korean reading practice stories for a Thai first-year learner.\n'+
  'STRICT RULES:\n- Use ONLY the vocabulary in VOCAB (conjugated as needed), plus basic particles (이/가, 은/는, 을/를, 에, 에서, 도, 와/과, 하고) and 이다/있다/없다 if needed.\n'+
  '- Use ONLY the grammar patterns in GRAMMAR (plus polite -아/어요 endings). If GRAMMAR is empty, use very simple present-tense polite sentences.\n'+
  '- Do not introduce any other content words. Prefer words marked learning/new so the learner practices them.\n'+
  '- Length: '+$('sLen').value+' sentences. Theme: '+($('sTheme').value.trim()||'free choice that fits the words')+'.\n'+
  'VOCAB (ko | meaning | pos | level):\n'+pool.map(function(v){return v.ko+' | '+v.mn+' | '+v.pos+' | '+v.lv}).join('\n')+'\n'+
  'GRAMMAR:\n'+(gram.length?gram.map(function(g){return g.pat+' | '+g.mn+(g.ex?' | e.g. '+g.ex:'')}).join('\n'):'(none)')+'\n'+
  'Return JSON only: {"titleKo":string,"titleTh":string,"sentences":[{"ko":string,"rd":"Thai-script pronunciation of the sentence","th":"Thai translation"}],"used":[dictionary forms of VOCAB words actually used]}';
  try{
    var r=await sample.json(prompt,{cache:false});
    if(!r||!r.sentences||!r.sentences.length)throw new Error('empty');
    curStory={id:uid(),titleKo:r.titleKo||'이야기',titleTh:r.titleTh||'',sentences:r.sentences.map(function(x){return{ko:x.ko||'',rd:x.rd||'',th:x.th||''}}),used:r.used||[],at:Date.now()};
    renderStory();$('sOut').scrollIntoView({behavior:'smooth',block:'nearest'});
  }catch(e){
    if(e&&e.code==='not_granted')err.textContent='ต้องอนุญาตให้หน้านี้ถาม Claude ก่อนจึงจะแต่งเรื่องได้';
    else if(e&&e.code==='rate_limited')err.textContent='ใช้บ่อยเกินไป รอสักครู่แล้วลองใหม่';
    else err.textContent='แต่งเรื่องไม่สำเร็จ ลองกดอีกครั้ง';
    err.hidden=false;
  }finally{btn.disabled=false;$('sInfo').textContent=''}
};

/* ---------- clicks ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-act]');if(!t)return;
  if(t.dataset.tab){
    document.querySelectorAll('#tabs button').forEach(function(b){b.setAttribute('aria-selected',b===t?'true':'false')});
    ['vocab','grammar','story','review'].forEach(function(n){$('p-'+n).hidden=n!==t.dataset.tab});
    if(t.dataset.tab==='review')startReview();
    return;
  }
  var a=t.dataset.act,kind=t.dataset.kind,id=t.dataset.id;
  if(a==='cycle'){
    var it=S[kind].find(function(x){return x.id===id});
    it.lv=LVORDER[(LVORDER.indexOf(it.lv)+1)%3];delete it.sample;save(kind);
    renderCounts();kind==='vocab'?renderVocab():(renderGrammar(),renderGramPick());
  }else if(a==='del'){
    var key=kind+id;
    if(armed!==key){armed=key;setTimeout(function(){if(armed===key){armed=null;rerender(kind)}},3000);rerender(kind);return}
    S[kind]=S[kind].filter(function(x){return x.id!==id});armed=null;save(kind);
    if(kind==='stories'&&curStory&&curStory.id===id)curStory=null;
    renderAll();
  }else if(a==='edit'){
    if(kind==='vocab'){
      var v=S.vocab.find(function(x){return x.id===id});editing.vocab=id;
      $('vKo').value=v.ko;$('vRd').value=v.rd;$('vMn').value=v.mn;$('vPos').value=v.pos;$('vLv').value=v.lv;$('vNote').value=v.note||'';
      $('vFormTitle').textContent='แก้ไขคำศัพท์';$('vSubmit').textContent='บันทึกการแก้ไข';$('vCancel').hidden=false;$('vForm').scrollIntoView({behavior:'smooth',block:'start'});
    }else{
      var g=S.grammar.find(function(x){return x.id===id});editing.grammar=id;
      $('gPat').value=g.pat;$('gMn').value=g.mn;$('gEx').value=g.ex||'';$('gExTh').value=g.exTh||'';$('gLv').value=g.lv;$('gNote').value=g.note||'';
      $('gFormTitle').textContent='แก้ไขไวยากรณ์';$('gSubmit').textContent='บันทึกการแก้ไข';$('gCancel').hidden=false;$('gForm').scrollIntoView({behavior:'smooth',block:'start'});
    }
  }else if(a==='saveStory'){
    S.stories.push(curStory);save('stories');renderStory();renderSaved();toast('บันทึกเรื่องแล้ว');
  }else if(a==='open'){
    curStory=S.stories.find(function(x){return x.id===id});renderStory();$('sOut').scrollIntoView({behavior:'smooth',block:'start'});
  }else if(a==='usage'){openUse[id]=!openUse[id];renderVocab();
  }else if(a==='genex'){genUsage(id);
  }else if(a==='delex'){
    var vv=S.vocab.find(function(x){return x.id===id});vv.exs.splice(+t.dataset.i,1);save('vocab');renderVocab();
  }else if(a==='reveal'){revealed=true;renderFlash()}
  else if(a==='rate'){
    var cur=queue[qi];cur.lv=t.dataset.lv;delete cur.sample;save('vocab');renderCounts();renderVocab();
    qi++;revealed=false;renderFlash();
  }else if(a==='restart'){startReview()}
});
function rerender(kind){kind==='vocab'?renderVocab():kind==='grammar'?renderGrammar():renderSaved()}

/* ---------- init ---------- */
opts($('vPos'),POS.map(function(p){return[p,p]}));
opts($('vLv'),LVORDER.map(function(l){return[l,LV[l]]}));$('vLv').value='new';
opts($('gLv'),LVORDER.map(function(l){return[l,LV[l]]}));$('gLv').value='new';
opts($('vFLv'),LVORDER.map(function(l){return[l,LV[l]]}),true,'ทุกระดับ');
opts($('vFPos'),POS.map(function(p){return[p,p]}),true,'ทุกชนิดคำ');
lvChecks($('sLvls'),['known','learning'],'sl');
lvChecks($('rLvls'),['new','learning'],'rl');
$('rLvls').addEventListener('change',startReview);
initStore().catch(function(){renderAll()});
renderAll();
})();
</script>

</body></html>
